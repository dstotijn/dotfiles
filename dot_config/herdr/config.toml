onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
new_cwd = "follow"

[keys]
# Caps Lock double-tap emits Ctrl+Space through Karabiner.
prefix = "ctrl+space"

# Keep tmux-style split and reload bindings available.
settings = "prefix+shift+s"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Ghostty translates the existing Hyper chords to Shift+F1 through Shift+F11.
previous_agent = "prefix+alt+p"
next_agent = "prefix+alt+n"
focus_agent = "prefix+alt+1..9"
previous_workspace = "shift+f2"
next_workspace = "shift+f1"

previous_tab = "prefix+shift+h"
next_tab = ["prefix+shift+l", "shift+f11"]
new_tab = ["prefix+c", "shift+f8"]

cycle_pane_next = ["prefix+tab", "shift+f3"]
cycle_pane_previous = ["prefix+shift+tab", "shift+f4"]
focus_pane_left = ["prefix+h", "shift+f5"]
focus_pane_right = ["prefix+l", "shift+f6"]

split_vertical = ["prefix+v", "shift+f9"]
split_horizontal = ["prefix+s", "shift+f10"]
zoom = ["prefix+z", "shift+f7"]

close_tab = "prefix+x"
close_pane = "prefix+shift+x"

swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"

[ui]
status_indicators = "dots"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true
# Herdr warns for non-MP3 paths, but macOS plays custom sounds through afplay.
path = "/System/Library/Sounds/Frog.aiff"
