# --- General ---
set -g default-terminal "tmux-256color"
# extkeys lets tmux distinguish Shift-Enter from Enter (Claude Code newlines)
set -as terminal-features 'xterm*:extkeys:RGB'
set -s extended-keys on
# Let OSC sequences through to the outer terminal (Claude Code's progress bar
# and notifications). all rather than on, so background windows still get through:
# on drops sequences from invisible panes, which silences a notification in
# exactly the case worth announcing. The cost is that any background pane can
# drive the progress bar; clear-progress.sh below keeps that from getting stuck.
set -g allow-passthrough all
# A pane that goes invisible can no longer clear the bar it set, so clear it when
# the active window or pane changes. Deliberately not pane-focus-out: that also
# fires when the terminal loses focus, which is when the bar is worth having.
set-hook -g session-window-changed 'run-shell -b "~/.config/tmux/clear-progress.sh"'
set-hook -g window-pane-changed 'run-shell -b "~/.config/tmux/clear-progress.sh"'
set -g mouse on
bind -T copy-mode-vi WheelUpPane send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 1 scroll-down
set -g history-limit 50000
set -g focus-events on
set -sg escape-time 0
set -g cursor-style blinking-block
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[1 q'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on
set -g automatic-rename on
# Prefer the pane's own title (Claude Code, fish and mise all set it via OSC 2)
# over pane_current_command, which for Claude Code is just a version number.
set -g automatic-rename-format "#{pane_title}"
# Ghostty puts its window title in the subtitle of every desktop notification.
# Left to itself that title describes the outer shell ("tmux attach ~"), which
# says nothing about which session fired. Pass the window through instead, so a
# notification identifies where it came from.
set -g set-titles on
set -g set-titles-string "#S:#I #W"
set -g monitor-bell on
set -g visual-bell off

# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- smart-splits.nvim (seamless Ctrl-hjkl across nvim/tmux) ---
set -g @plugin 'mrjones2014/smart-splits.nvim'

# --- Vim-style splits ---
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Vim-style pane resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Vim copy mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
# Don't snap to bottom after mouse selection: copy but stay in copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"

# --- Windows ---
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
# x kills the window, X the pane (tmux binds x to kill-pane and & to kill-window).
bind x confirm-before -p "kill-window #W? (y/n)" kill-window
bind X confirm-before -p "kill-pane #P? (y/n)" kill-pane
unbind '&'
# With extended keys negotiated, Alt+Shift+<key> arrives as M-S-<key> rather than
# M-<key>. Keep both so these still work where extended keys aren't negotiated.
bind -n M-H previous-window
bind -n M-L next-window
bind -n M-S-H previous-window
bind -n M-S-L next-window

# --- Hyper navigation (Caps Lock via Karabiner and Ghostty) ---
# Ghostty sends F13-F18 sequences, which tmux names Shift-F1 through Shift-F6.
bind -n S-F1 next-window
bind -n S-F2 previous-window
# Pane cycling skips panes marked as sidebars.
bind -n S-F3 select-pane -t :.+ \; if -F '#{@sidebar-pane}' 'select-pane -t :.+'
bind -n S-F4 select-pane -t :.- \; if -F '#{@sidebar-pane}' 'select-pane -t :.-'
bind -n S-F5 select-pane -L \; if -F '#{@sidebar-pane}' 'select-pane -R'
bind -n S-F6 select-pane -R

# --- Clear scrollback (Cmd+K via Ghostty sends Shift-F12) ---
bind -n S-F12 if -F "#{@pane-is-vim}" "" "send-keys -R \; send-keys C-l \; run-shell 'sleep 0.1' \; clear-history"

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- No status bar (Catppuccin Mocha elsewhere) ---
# The sidebar carries the session name and the window list, so the status line
# had nothing left but a clock. Off means content starts at the very top row:
# it also removes the blank second status line that used to pad it.
set -g status off
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#1e1e2e,fg=#fab387"

# --- Sidebar (vertical window list) ---
# A narrow pane pinned to the left of every window, listing the session's windows
# stacked, each with an optional description. status-position is top or bottom
# only and pane-border-format is a horizontal strip, so tmux offers no vertical
# chrome: a pane is the only way to get a sidebar.
set -g @sidebar-width 36
set -g @sidebar-tick 2
set -g @sidebar-desc-lines 2
bind b run-shell -b "~/.config/tmux/sidebar-toggle.sh"

# Indexed hooks, so these sit alongside the clear-progress hooks above instead of
# replacing them, and so re-sourcing this file overwrites index 10 rather than
# stacking another copy the way set-hook -a would.
set-hook -g 'session-created[10]'       'run-shell -b "~/.config/tmux/sidebar-attach.sh \"#{window_id}\""'
set-hook -g 'after-new-window[10]'      'run-shell -b "~/.config/tmux/sidebar-attach.sh \"#{window_id}\""'
set-hook -g 'window-linked[10]'         'run-shell -b "~/.config/tmux/sidebar-attach.sh \"#{window_id}\""'
# Session ids look like $0, and run-shell hands the command to sh -c, which would
# substitute that for its own name. Single quotes keep it intact.
set-hook -g 'client-attached[10]'       "run-shell -b \"~/.config/tmux/sidebar-sweep.sh '#{session_id}'\""
set-hook -g 'client-resized[10]'        "run-shell -b \"~/.config/tmux/sidebar-pin.sh '#{session_id}'\""
set-hook -g 'window-layout-changed[10]' "run-shell -b \"~/.config/tmux/sidebar-pin.sh '#{session_id}'\""
# Deliberately not window-renamed: automatic-rename-format "#{pane_title}" makes
# that fire on every frame of Claude Code's title spinner. The tick covers it.
set-hook -g 'session-window-changed[10]' 'wait-for -S sidebar-refresh'

# Each mouse binding falls through to tmux's stock behaviour, reproduced verbatim
# from a default 3.6 server, when the event is not in a sidebar. WheelDownPane has
# no default binding, hence the mouse_any_flag guard rather than a bare send-keys
# (which would type escape sequences into a shell).
bind -n MouseDown1Pane if -F -t= '#{@sidebar-pane}' \
  "run-shell -b \"~/.config/tmux/sidebar-click.sh '#{pane_id}' '#{mouse_y}'\"" \
  "select-pane -t= ; send-keys -M"
bind -n MouseDrag1Pane if -F -t= '#{@sidebar-pane}' "" \
  "if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -M'"
bind -n WheelUpPane if -F -t= '#{@sidebar-pane}' "previous-window" \
  "if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane if -F -t= '#{@sidebar-pane}' "next-window" \
  "if -F '#{mouse_any_flag}' 'send-keys -M' ''"

# Border drags: suspend the width pin for the duration, then adopt the result as
# the width for every sidebar in the session.
bind -n MouseDown1Border set -g @sidebar-dragging 1
bind -n MouseDragEnd1Border run-shell -b "~/.config/tmux/sidebar-adopt.sh '#{session_id}'"

# Retrofit windows that already exist when this file is sourced.
run-shell -b "~/.config/tmux/sidebar-sweep.sh"

# --- TPM (keep at bottom) ---
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

# --- Sidebar focus guard (must follow TPM) ---
# The sidebar must never hold focus: automatic-rename-format "#{pane_title}" would
# name the window after it. Move left, then step back if that landed in a sidebar.
# smart-splits binds C-h itself when TPM loads it above, so this has to come after
# that line to win; it keeps the @pane-is-vim check so nvim still gets the key.
bind -n C-h if -F '#{@pane-is-vim}' "send-keys C-h" \
  { select-pane -L ; if -F '#{@sidebar-pane}' "select-pane -R" }
