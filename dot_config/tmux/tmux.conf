# --- General ---
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",ghostty:RGB"
set -s extended-keys on
set -g mouse on
bind -T copy-mode-vi WheelUpPane send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 1 scroll-down
set -g history-limit 50000
set -g focus-events on
set -sg escape-time 0
set -g cursor-style blinking-block
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[1 q'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on
set -g automatic-rename off
set -g monitor-bell on
set -g visual-bell off

# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- smart-splits.nvim (seamless Ctrl-hjkl across nvim/tmux) ---
set -g @plugin 'mrjones2014/smart-splits.nvim'

# --- Vim-style splits ---
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Vim-style pane resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Vim copy mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
# Don't snap to bottom after mouse selection: copy but stay in copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"

# --- Windows ---
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind -n M-H previous-window
bind -n M-L next-window

# --- Clear scrollback (Cmd+K via Ghostty sends Shift-F12) ---
bind -n S-F12 if -F "#{@pane-is-vim}" "" "send-keys -R \; send-keys C-l \; run-shell 'sleep 0.1' \; clear-history"

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- Status bar (Catppuccin Mocha) ---
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=#94e2d5]%H:%M #[fg=#cdd6f4]│ #[fg=#fab387]%d %b"
set -g status-right-length 40
setw -g window-status-format "#[fg=#{?#{==:#{@agentwatch_prefix},!},#734a5f,#{?#{==:#{@agentwatch_prefix},*},#495a80,#{?#{==:#{@agentwatch_prefix},✓},#546d5c,#1e1e2e}}},bg=#1e1e2e]#[bg=#{?#{==:#{@agentwatch_prefix},!},#734a5f,#{?#{==:#{@agentwatch_prefix},*},#495a80,#{?#{==:#{@agentwatch_prefix},✓},#546d5c,#1e1e2e}}},fg=#{?#{==:#{@agentwatch_prefix},!},#f38ba8,#{?#{==:#{@agentwatch_prefix},*},#89b4fa,#{?#{==:#{@agentwatch_prefix},✓},#a6e3a1,#6c7086}}},#{?#{==:#{@agentwatch_prefix},!},bold,nobold}] #{?@agentwatch_prefix,#{?#{==:#{@agentwatch_prefix},!},,#{?#{==:#{@agentwatch_prefix},*},,}} ,}#[fg=#{?@agentwatch_prefix,#cdd6f4,#a6adc8}]#{?#{==:#{window_name},fish},#{b:pane_current_path},#W} #[fg=#{?#{==:#{@agentwatch_prefix},!},#734a5f,#{?#{==:#{@agentwatch_prefix},*},#495a80,#{?#{==:#{@agentwatch_prefix},✓},#546d5c,#1e1e2e}}},bg=#1e1e2e]#[fg=#cdd6f4,nobold]"
setw -g window-status-current-format "#[fg=#cba6f7,bg=#1e1e2e]#[bg=#cba6f7,fg=#1e1e2e,bold] #{?@agentwatch_prefix,#{?#{==:#{@agentwatch_prefix},!},,#{?#{==:#{@agentwatch_prefix},*},,}} ,}#[fg=#1e1e2e]#{?#{==:#{window_name},fish},#{b:pane_current_path},#W} #[fg=#cba6f7,bg=#1e1e2e]#[fg=#cdd6f4,nobold]"
setw -g window-status-separator "  "
setw -g window-status-bell-style none
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#1e1e2e,fg=#fab387"
set -g status 2
set -g 'status-format[1]' '#[bg=#1e1e2e] '

# --- Agentwatch (coding-agent attention prefixes) ---
set-environment -g AGENTWATCH_BIN "/Users/dstotijn/.local/bin/agentwatch"
set-hook -g after-select-window "run-shell -b '\"\$AGENTWATCH_BIN\" ack'"
set-hook -g window-pane-changed  "run-shell -b '\"\$AGENTWATCH_BIN\" ack'"

# --- TPM (keep at bottom) ---
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
