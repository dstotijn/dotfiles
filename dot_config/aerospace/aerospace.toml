config-version = 2

after-login-command = []
after-startup-command = []
start-at-login = true
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = [
  '0_terminal',
  '1_browser',
  '2_code',
  '3_comms',
  '4_productivity',
  '5_media',
  '8_ai',
  '9_misc',
]

[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = [{ monitor."built-in" = 6 }, 12]
inner.vertical = [{ monitor."built-in" = 6 }, 12]
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
# Layout
alt-f = 'layout floating tiling'
alt-slash = 'layout h_tiles vertical'
alt-a = 'layout v_accordion'
alt-shift-b = 'balance-sizes'

# Focus
alt-h = 'focus left --boundaries-action wrap-around-the-workspace'
alt-j = 'focus down --boundaries-action wrap-around-the-workspace'
alt-k = 'focus up --boundaries-action wrap-around-the-workspace'
alt-l = 'focus right --boundaries-action wrap-around-the-workspace'

# Resizing
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspace switching
alt-1 = 'workspace 1_browser'
alt-2 = 'workspace 2_code'
alt-3 = 'workspace 3_comms'
alt-4 = 'workspace 4_productivity'
alt-5 = 'workspace 5_media'
alt-8 = 'workspace 8_ai'
alt-9 = 'workspace 9_misc'
alt-0 = 'workspace 0_terminal'
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'workspace prev'


# Workspace assignment
alt-shift-1 = 'move-node-to-workspace 1_browser'
alt-shift-2 = 'move-node-to-workspace 2_code'
alt-shift-3 = 'move-node-to-workspace 3_comms'
alt-shift-4 = 'move-node-to-workspace 4_productivity'
alt-shift-5 = 'move-node-to-workspace 5_media'
alt-shift-8 = 'move-node-to-workspace 8_ai'
alt-shift-9 = 'move-node-to-workspace 9_misc'
alt-shift-0 = 'move-node-to-workspace 0_terminal'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = 'mode main'
r = ['reload-config', 'mode main']
f = ['flatten-workspace-tree', 'mode main']                # reset layout
backspace = ['close-all-windows-but-current', 'mode main']

# Move windows
h = ['move left', 'mode main']
j = ['move down', 'mode main']
k = ['move up', 'mode main']
l = ['move right', 'mode main']

# Join windows
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[workspace-to-monitor-force-assignment]
'1_browser' = 'main'
'2_code' = 'main'
'3_comms' = 'secondary'
'4_productivity' = 'secondary'
'5_media' = 'secondary'
'8_ai' = 'secondary'
'9_misc' = 'secondary'
'0_terminal' = 'secondary'

# 1. Browser
[[on-window-detected]]
if = 'test %{app-bundle-id} = org.chromium.Chromium'
run = 'move-node-to-workspace 1_browser'

# 2. Code
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.microsoft.VSCode'
run = 'move-node-to-workspace 2_code'


# 3. Comms
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.MobileSMS'
run = 'move-node-to-workspace 3_comms'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3_comms'

[[on-window-detected]]
if = 'test %{app-bundle-id} = org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 3_comms'

# 4. Productivity
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.todoist.mac.Todoist'
run = 'move-node-to-workspace 4_productivity'

[[on-window-detected]]
if = 'test %{app-bundle-id} = notion.id'
run = 'move-node-to-workspace 4_productivity'

[[on-window-detected]]
if = 'test %{app-bundle-id} = md.obsidian'
run = 'move-node-to-workspace 4_productivity'

# 5. Media
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.electron.pocket-casts'
run = 'move-node-to-workspace 5_media'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.spotify.client'
run = 'move-node-to-workspace 5_media'

# 8. AI
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 8_ai'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.openai.codex'
run = 'move-node-to-workspace 8_ai'

# 9. Misc
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.finder'
run = 'move-node-to-workspace 9_misc'

[[on-window-detected]]
if = "test %{app-bundle-id} = com.1password.1password && test %{window-title} ~= '(Quick Access|Lock Screen) — 1Password|^1Password$'"
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.1password.1password'
run = 'move-node-to-workspace 9_misc'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.nordvpn.macos'
run = 'move-node-to-workspace 9_misc'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.Replacicon.Replacicon'
run = 'move-node-to-workspace 9_misc'

# 0. Terminal
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
run = 'move-node-to-workspace 0_terminal'

# Fallback
[[on-window-detected]]
if = 'true'
run = 'move-node-to-workspace 9_misc'
